project:
  id: song
  name: 宋末
  subtitle: 丹心千秋
  series: 千載風雲
  type: historical_fiction
  domain_agent: writing
  language: zh-TW
  era: 北宋末至南宋末 (1100–1283 年)
  status: in_progress
  tags:
    - 靖康之變
    - 岳飛北伐
    - 襄樊保衛戰
    - 崖山海戰
    - 歷史群像

scale:
  total_volumes: 8
  total_chapters: 720
  chapters_per_volume: 90
  volume_structure: files

structure:
  outline: outline_master.md
  volumes_plan: volume_plan.md
  volumes: .
  chapters: chapters/
  timeline: chronology.md
  characters: characters.md
  geography: geography.md
  military_reference: military_reference.md
  social_systems: social_environment.md
  bibliography: sources_and_fact_policy.md
  master_bible: master_bible.md
  rules: chapter_writer_rules.md
  scripts:
    - generate_novel.py

writing_policy:
  historical_accuracy: high
  battle_tactics_focus: false
  narrative_dimensions:
    - 朝廷與制度線
    - 戰爭與邊疆線
    - 地方與生活線
    - 人物與記憶線
  classifications:
    - historical_fact
    - reasonable_inference
    - fictional_content
  preserve_historical_figures: true
  require_consistency_check: true
  anti_anachronism: true
  anti_teleportation: true
  information_boundary: true

authority:
  confirmed_settings: user_approved
  historical_facts: multi_source_verified
  unresolved_questions: never_assume_verified
  adjudications:
    - 跨年改元嚴格防雷（如汴京破城公曆1127年1月9日）
    - 多源互證、保留分歧、標明推演

storage:
  type: filesystem
  root: /opt/src/github/novel2movie/song

version_control:
  type: git
  enabled: true
  default_branch: main

governance:
  direct_main_write: false
  require_diff_review: true
  require_human_approval_for_major_changes: true

continuity:
  enabled: true

memory:
  enabled: true
